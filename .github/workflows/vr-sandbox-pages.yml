name: vr-sandbox Pages

# Publishes Nexus so it opens anywhere: the 2D front door on a laptop or a phone, and the forge in the Meta Quest
# browser (WebXR needs HTTPS), installable as an app. index.html is the home page; forge.html, make.html,
# boards.html, claude.html, look.html and room.html are the doors it opens.
# One-time setup: repository Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'vr-sandbox/**'
      - '.github/workflows/vr-sandbox-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vr-sandbox-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vr-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vr-sandbox/package-lock.json
      - run: npm ci
      - run: npm run gate
      - run: npm run nexus:view
      # The landing page is view/index.html, the 2D front door, which opens on a laptop or a phone and links to
      # the forge, the make page, the boards and the rest. It used to be overwritten here with forge.html, because
      # the forge was the whole app and WebXR needs HTTPS; now the forge is one door of several and keeps its own
      # name, which is what the home page links to.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: vr-sandbox/dist-view

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
