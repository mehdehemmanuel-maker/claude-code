name: vr-sandbox Pages

# Publishes the Nexus app (view/: the dashboard, the phone page vibe.html, the space, the look and the gauntlet) so it
# opens on a phone and in the Meta Quest browser (WebXR needs HTTPS) and installs as an app. A phone opening it lands on
# the phone page. A static copy has no relay, so no key and no Claude: its pieces and boards open, and the chat says
# where Claude is (the app served by `npm run app`). One-time setup: repository Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'vr-sandbox/**'
      - '.github/workflows/vr-sandbox-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vr-sandbox-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vr-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vr-sandbox/package-lock.json
      - run: npm ci
      - run: npx vite build --config vite.view.config.ts --logLevel error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: vr-sandbox/dist-view

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
