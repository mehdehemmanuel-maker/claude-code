name: vr-sandbox CI

on:
  push:
    paths:
      - 'vr-sandbox/**'
      - '.github/workflows/vr-sandbox-*.yml'
  pull_request:
    paths:
      - 'vr-sandbox/**'
      - '.github/workflows/vr-sandbox-*.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vr-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vr-sandbox/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, golden, codec, physics conformance and architecture tests
        run: npm test
