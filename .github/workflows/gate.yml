# The gate, off this container's cores. Locally `npm run gate` is one typecheck and 150 test files on four workers:
# 141-146 s, and nothing else can use the machine while it runs. Here the typecheck is its own job and the test files
# are dealt into four shards that run at once, so the slowest shard is the wall clock. Vitest deals by file, and the
# two long sweeps are already several files each (tests/nexus/sweep.ts), so the heavy kits land in different shards.
name: gate

on:
  push:
    branches: ['claude/**']
    paths: ['vr-sandbox/**', '.github/workflows/gate.yml']
  pull_request:
    paths: ['vr-sandbox/**', '.github/workflows/gate.yml']
  workflow_dispatch:

# A second push supersedes the first: the older run is cancelled rather than paid for.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: vr-sandbox

jobs:
  # Types first and alone: it is seconds, it fails on anything the shards would all fail on, and a red typecheck
  # makes the shards' own failures unreadable.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vr-sandbox/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .

  # The lint that keeps the tree clean, before the long run, for the same reason.
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vr-sandbox/package-lock.json
      - run: npm ci
      - run: npx vitest run tests/nexus/tidy.test.ts

  test:
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one red shard must not hide the other three
      matrix:
        shard: [1, 2, 3, 4]
    name: test ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vr-sandbox/package-lock.json
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/4
