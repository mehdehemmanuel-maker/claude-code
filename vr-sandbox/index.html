<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14171c" />
    <title>Creative Sandbox</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23ffb347' stroke-width='8' stroke-dasharray='9 6'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%23ffb347'/%3E%3C/svg%3E" />
    <style>
      /* The app runs in the headset; this page is how the Quest browser gets there, and what the headset holds. */
      :root { color-scheme: dark; --bg: #14171c; --panel: rgba(28, 32, 38, 0.96); --ink: #e8ecf1; --muted: #9aa4af; --dim: #6f7883; --accent: #ffb347; --ego: #8fd3ff; --edge: rgba(255, 255, 255, 0.1); }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 17px/1.45 system-ui, sans-serif; overflow: hidden; }
      #viewport { position: fixed; inset: 0; }
      #viewport canvas { display: block; width: 100%; height: 100%; }
      #launch { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(20, 23, 28, 0.55); overflow: auto; }
      #launch[hidden] { display: none; }
      .card { box-sizing: border-box; width: 100%; max-width: 480px; background: var(--panel); border: 1px solid var(--edge); border-radius: 20px; padding: 26px; display: grid; gap: 14px; }
      h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
      .lede { margin: 0; color: var(--muted); }
      label.field { display: grid; gap: 6px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
      select, button, textarea { font: inherit; border-radius: 12px; box-sizing: border-box; width: 100%; }
      select { padding: 12px; background: #23272e; color: var(--ink); border: 1px solid rgba(255, 255, 255, 0.16); text-transform: none; letter-spacing: 0; }
      #vr { padding: 16px; font-size: 20px; font-weight: 650; background: var(--accent); color: #1b1400; border: 0; cursor: pointer; }
      #vr:disabled { opacity: 0.45; cursor: default; }
      #status { margin: 0; font-size: 15px; color: var(--muted); }
      .facts { margin: 0; padding: 12px 14px; border: 1px solid var(--edge); border-radius: 12px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 15px; }
      .facts dt { color: var(--dim); }
      .facts dd { margin: 0; font-variant-numeric: tabular-nums; }
      .facts dd.ego { color: var(--ego); }
      details { border: 1px solid var(--edge); border-radius: 12px; padding: 10px 14px; }
      summary { cursor: pointer; color: var(--muted); font-size: 15px; }
      details[open] summary { margin-bottom: 10px; }
      textarea { min-height: 72px; padding: 10px; background: #1b1f25; color: var(--ink); border: 1px solid rgba(255, 255, 255, 0.16); resize: vertical; font-family: ui-monospace, monospace; font-size: 13px; }
      .secondary { padding: 12px; margin-top: 8px; background: #23272e; color: var(--ink); border: 1px solid rgba(255, 255, 255, 0.16); cursor: pointer; }
      #reports { padding-top: 14px; border-top: 1px solid var(--edge); }
      #reports p { margin: 0 0 10px; }
      #build { margin: 0; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div id="viewport"></div>
    <div id="launch">
      <div class="card">
        <h1>Creative Sandbox</h1>
        <p class="lede">A physics workshop for Meta Quest. Build with real materials, joints and magnets. Ego designs with you, tests on her own stand, and keeps a journal of what she found.</p>
        <label class="field">How to be there
          <select id="vrmode" disabled aria-label="How to be there">
            <option value="relax">Relax: fly around the workshop</option>
            <option value="walk">Walk: your real room, 1:1</option>
            <option value="mixed" id="vrmode-mixed">Mixed reality: build in your room</option>
          </select>
        </label>
        <button id="vr" disabled>Enter VR</button>
        <p id="status">Starting physics…</p>
        <dl id="headset" class="facts" hidden></dl>
        <details id="shared">
          <summary>Open a shared build</summary>
          <textarea id="share-code" placeholder="Paste a share code (VRSB1.…) or a link with #build=…" aria-label="Share code"></textarea>
          <button id="share-open" class="secondary">Open it</button>
        </details>
        <div id="reports" hidden>
          <p id="reports-text"></p>
          <button id="reports-send" class="secondary">Send Ego's reports to Claude</button>
          <button id="reports-copy" class="secondary">Copy them</button>
        </div>
        <p id="build"></p>
      </div>
    </div>
    <div id="loading" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
