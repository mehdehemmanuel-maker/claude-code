<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Nexus: say it, see it built</title>
  <link rel="manifest" href="./vibe.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b0f17" />
  <style>
    :root { --bg: #0b0f17; --glass: rgba(16, 22, 34, .82); --line: #ffffff17; --text: #e8eef7; --dim: #93a1b5; --accent: #5ad1ff; --accent2: #b98cff; --ok: #69f0ae; --bad: #ff6b6b; --wait: #ffc14d; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; overscroll-behavior: none; }
    #app { position: fixed; inset: 0; height: 100dvh; display: flex; flex-direction: column; }
    /* the 3D view fills everything; the rest floats over it */
    #view { position: absolute; inset: 0 0 var(--under, 0px) 0; }
    #view canvas { position: absolute; inset: 0; }
    button { font: inherit; color: var(--text); background: #ffffff10; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; cursor: pointer; }
    button:active { transform: scale(.97); }
    button.hot { background: linear-gradient(135deg, #1f6fb2, #6b3fc4); border-color: #7f6cff80; }
    /* the top bar */
    #top { position: relative; z-index: 5; display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; background: linear-gradient(#0b0f17f0, #0b0f1700); pointer-events: none; }
    #top > * { pointer-events: auto; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .3px; }
    .logo svg { width: 26px; height: 26px; }
    #title { flex: 1; min-width: 0; color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #top button { padding: 6px 10px; font-size: 13px; border-radius: 10px; background: var(--glass); backdrop-filter: blur(10px); }
    /* what is shown, said in a line */
    #stat { position: relative; z-index: 4; margin: 0 12px; align-self: flex-start; font-size: 12px; color: var(--dim); background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; pointer-events: none; }
    #stat:empty { display: none; }
    #stat b { color: var(--text); font-weight: 600; }
    #picked { position: absolute; z-index: 4; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 92px); background: var(--glass); backdrop-filter: blur(10px); border: 1px solid #5ad1ff55; border-radius: 12px; padding: 6px 12px; font-size: 13px; max-width: 86vw; text-align: center; display: none; }
    #empty { position: absolute; z-index: 3; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; color: var(--dim); padding: 0 32px 40vh; }
    #empty h1 { margin: 0 0 6px; font-size: 26px; color: var(--text); background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    /* the chat: a sheet at the foot, pulled up to read, down to see */
    #sheet { position: relative; z-index: 6; margin-top: auto; display: flex; flex-direction: column; background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 0 0 calc(env(safe-area-inset-bottom) + 8px); max-height: 62dvh; transition: max-height .25s ease; }
    #sheet.low #msgs { display: none; }
    #grab { align-self: center; width: 100%; display: flex; justify-content: center; padding: 8px 0 4px; background: none; border: 0; }
    #grab::before { content: ''; width: 42px; height: 5px; border-radius: 3px; background: #ffffff38; }
    #msgs { overflow-y: auto; padding: 2px 12px 8px; display: flex; flex-direction: column; gap: 8px; min-height: 0; flex: 1; -webkit-overflow-scrolling: touch; }
    .msg { max-width: 92%; padding: 8px 12px; border-radius: 16px; font-size: 14px; word-wrap: break-word; }
    .msg.me { align-self: flex-end; background: linear-gradient(135deg, #1f6fb2, #6b3fc4); border-bottom-right-radius: 5px; }
    .msg.ai { align-self: flex-start; background: #ffffff0d; border: 1px solid var(--line); border-bottom-left-radius: 5px; }
    .msg.ai.bad { border-color: #ff6b6b66; }
    .msg .steps { margin-top: 6px; font-size: 12px; color: var(--dim); display: flex; flex-direction: column; gap: 2px; }
    .msg .steps span.f { color: var(--bad); }
    .msg details { margin-top: 6px; font-size: 12px; color: var(--dim); }
    .msg code { background: #ffffff12; padding: 0 4px; border-radius: 4px; font-size: 12px; }
    .msg .live { color: var(--wait); font-size: 12px; }
    .dots::after { content: '…'; animation: d 1.2s steps(3) infinite; }
    @keyframes d { 0% { content: '.'; } 33% { content: '..'; } 66% { content: '…'; } }
    /* pieces and ideas: a row that scrolls sideways */
    #chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 12px 8px; scrollbar-width: none; flex: none; }
    #chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; white-space: nowrap; font-size: 13px; padding: 7px 12px; border-radius: 999px; background: #ffffff0f; }
    .chip.open { border-color: #5ad1ff55; }
    .chip.ask { border-color: #b98cff55; }
    .chip .k { opacity: .6; margin-right: 4px; }
    #ask { display: flex; gap: 8px; padding: 0 12px; align-items: flex-end; flex: none; }
    #q { flex: 1; min-width: 0; resize: none; font-family: inherit; font-size: 16px; line-height: 1.35; color: var(--text); background: #00000040; border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; max-height: 120px; outline: none; }
    #q:focus { border-color: #5ad1ff88; }
    #go { width: 46px; height: 46px; border-radius: 50%; padding: 0; display: grid; place-items: center; flex: none; }
    #go svg { width: 20px; height: 20px; }
    #go[disabled] { opacity: .5; }
    /* the board, as a list, when asked for */
    #board { position: absolute; z-index: 8; inset: 0; background: #0b0f17; display: none; flex-direction: column; padding: calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 10px); }
    #board.on { display: flex; }
    #board header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    #board header b { flex: 1; }
    #nodes { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .node { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; background: #ffffff07; font-size: 13px; }
    .node .h { display: flex; gap: 8px; align-items: center; }
    .node .h i { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--ok); }
    .node.failed .h i { background: var(--bad); } .node.waiting .h i { background: var(--wait); }
    .node .h b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .node .h span { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
    .node .o { color: var(--dim); font-size: 12px; margin-top: 3px; }
    .node .e { color: var(--bad); font-size: 12px; margin-top: 3px; }
    @media (min-width: 900px) { #view { bottom: 0; } #sheet { position: absolute; right: 16px; bottom: 16px; width: 420px; border-radius: 20px; border: 1px solid var(--line); max-height: calc(100dvh - 110px); } #board { left: auto; width: 460px; border-left: 1px solid var(--line); } }
  </style>
</head>
<body>
  <div id="app">
    <div id="view"></div>
    <div id="top">
      <div class="logo"><svg viewBox="0 0 32 32"><defs><linearGradient id="lg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#5ad1ff"/><stop offset="1" stop-color="#b98cff"/></linearGradient></defs><path d="M16 2 29 9.5v13L16 30 3 22.5v-13Z" fill="none" stroke="url(#lg)" stroke-width="2.4"/><path d="M10 21V11l12 10V11" fill="none" stroke="url(#lg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Nexus</div>
      <div id="title"></div>
      <button id="fit" title="See it all">Fit</button>
      <button id="cut" title="Cut it open: across x, then z, then y, then whole again">Cut</button>
      <button id="showBoard" title="The nodes it is built from">Nodes</button>
    </div>
    <div id="stat"></div>
    <div id="picked"></div>
    <div id="empty"><div><h1>Say it. See it built.</h1>Describe a part or a small build: Claude builds it from real pieces (bolts, plates, wire, LEDs, boxes, pipes) with the nodes, and it appears here. Or tap a piece below.</div></div>
    <section id="sheet">
      <button id="grab" aria-label="Show or hide the chat"></button>
      <div id="msgs"></div>
      <div id="chips"></div>
      <div id="ask"><textarea id="q" rows="1" placeholder="Describe what to build…" enterkeyhint="send"></textarea><button id="go" class="hot" aria-label="Build it"><svg viewBox="0 0 24 24"><path d="M3 11.5 21 3l-8.5 18-2-7.5Z" fill="currentColor"/></svg></button></div>
    </section>
    <div id="board"><header><b>The nodes it is built from</b><button id="toFull" title="The whole board, with every node's settings and wires (best on a bigger screen)">Full board ↗</button><button id="hideBoard">Close</button></header><div id="nodes"></div></div>
  </div>
  <script type="module" src="../src/nexus/view/vibe.ts"></script>
</body>
</html>
