<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nexus Dashboard</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#070a10" />
  <style>
    :root {
      --bg: #070a10; --panel: #0d121b; --panel2: #131a26; --line: #1f2a3a; --text: #dfe7f1; --dim: #8796aa; --accent: #40c4ff;
      --ok: #69f0ae; --bad: #ff5252; --wait: #ffb300;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; }
    #app { display: grid; grid-template-columns: 250px minmax(0, 1fr) minmax(360px, 30vw); grid-template-rows: 52px minmax(0, 1fr) 232px; height: 100%; gap: 8px; padding: 0 8px 8px; }
    header { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 0 6px; border-bottom: 1px solid var(--line); margin: 0 -8px; padding: 0 14px; background: linear-gradient(90deg, #0b1626, #140c26 50%, #0a1d1c); }
    .logo { display: flex; align-items: center; gap: 9px; margin-right: 8px; }
    .logo svg { width: 30px; height: 30px; }
    .tag { color: var(--dim); font-size: 12px; white-space: nowrap; }
    a.btn { color: var(--text); text-decoration: none; background: linear-gradient(90deg, #1b3a5a, #3a1b5a); border: 1px solid #5a3f9a; border-radius: 7px; padding: 6px 10px; white-space: nowrap; }
    /* panels: each its own colour, as the board's kinds are */
    .pane { background: var(--panel); border: 1px solid color-mix(in srgb, var(--hue) 45%, transparent); border-radius: 12px; box-shadow: 0 0 22px -8px color-mix(in srgb, var(--hue) 55%, transparent), inset 0 1px 0 #ffffff08; min-height: 0; min-width: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; }
    .pane > .ph { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid #ffffff0c; font-size: 11px; letter-spacing: .9px; text-transform: uppercase; color: var(--hue); font-weight: 700; flex: none; }
    .pane > .ph .dotx { width: 8px; height: 8px; border-radius: 50%; background: var(--hue); box-shadow: 0 0 8px var(--hue); }
    .pane > .ph .sp { flex: 1; }
    .pane > .ph .tag { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; text-transform: none; letter-spacing: 0; font-weight: 500; }
    .pane > .ph button, .pane > .ph a.btn { text-transform: none; letter-spacing: 0; font-weight: 500; padding: 3px 8px; font-size: 12px; }
    .pane > .pb { flex: 1; min-height: 0; overflow: auto; }
    #lib.pane { --hue: #40c4ff; } main.pane { --hue: #e040fb; } #dock { --hue: #18ffff; } #inspector.pane { --hue: #ffd740; }
    #logP { --hue: #69f0ae; } #metP { --hue: #ff6e40; } #varP { --hue: #b388ff; }
    #right { grid-row: 2 / 4; grid-column: 3; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
    #dock { flex: 0 0 52%; }
    #dock.big { position: fixed; inset: 60px 8px 8px 8px; z-index: 40; flex: none; }
    #view3d canvas { position: absolute; inset: 0; }
    #view3d { flex: 1; min-height: 0; position: relative; background: radial-gradient(ellipse at 50% 30%, #0f1a2c, #05080d 70%); }
    #view3d .stat3d { position: absolute; left: 10px; bottom: 50px; color: var(--dim); font-size: 11px; pointer-events: none; }
    .tbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-top: 1px solid #ffffff0c; flex: none; }
    .tbar input[type=range] { flex: 1; accent-color: #18ffff; }
    .tbar .tread { font-variant-numeric: tabular-nums; min-width: 72px; color: #a7ffeb; flex: none; }
    .tbar.idle .tread { flex: 1; color: var(--dim); }
    .tbar.idle { opacity: .55; }
    #strip { grid-row: 3; grid-column: 2; display: grid; grid-template-columns: 1.1fr 1.3fr 1.2fr; gap: 8px; min-height: 0; }
    #lib { grid-row: 2 / 4; }
    #log div { display: grid; grid-template-columns: 16px 1fr auto; gap: 6px; padding: 3px 10px; font-size: 12px; border-bottom: 1px solid #ffffff06; }
    #log .run { color: var(--dim); grid-template-columns: 1fr; font-size: 11px; padding-top: 6px; }
    #log .ms { color: var(--dim); font-variant-numeric: tabular-nums; }
    #gauges { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 8px 6px; }
    .gauge { text-align: center; }
    .gauge svg { width: 100%; max-width: 92px; height: auto; }
    .gauge .gl { font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; }
    .gauge .gs { font-size: 10.5px; color: #8796aa; }
    #metNote { padding: 0 10px 8px; color: var(--dim); font-size: 11px; }
    #vars table { width: 100%; border-collapse: collapse; font-size: 12px; }
    #vars th { text-align: left; color: var(--dim); font-weight: 500; padding: 4px 8px; font-size: 11px; position: sticky; top: 0; background: var(--panel); }
    #vars td { white-space: nowrap; padding: 5px 8px; border-top: 1px solid #ffffff08; font-variant-numeric: tabular-nums; }
    #vars tr.on td { background: #1d1638; }
    #vars tr.pickable { cursor: pointer; } #vars tr.pickable:hover td { background: #171f30; }
    #vars .why { padding: 10px; color: var(--dim); font-size: 12px; }
    .ph select, #vars select { background: #0a0f17; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; font: inherit; }
    header h1 { font-size: 15px; margin: 0 10px 0 0; letter-spacing: .3px; white-space: nowrap; }
    header h1 b { background: linear-gradient(90deg, #40c4ff, #e040fb, #ffd740, #69f0ae); -webkit-background-clip: text; background-clip: text; color: transparent; }
    #crumbs { display: flex; gap: 4px; align-items: center; color: var(--dim); white-space: nowrap; overflow: hidden; }
    #crumbs a { color: var(--accent); cursor: pointer; }
    #cmd { flex: 1; max-width: 420px; margin-left: auto; position: relative; }
    #cmd input { width: 100%; background: #0a0f17; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 7px 10px; outline: none; }
    #cmd input:focus { border-color: var(--accent); }
    #cmdList { position: absolute; top: 36px; left: 0; right: 0; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; max-height: 340px; overflow: auto; z-index: 20; display: none; }
    #cmdList div { padding: 6px 10px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
    #cmdList div.on, #cmdList div:hover { background: #1b2536; }
    button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; cursor: pointer; font: inherit; white-space: nowrap; }
    button:hover { border-color: var(--accent); }
    button.on { background: #12324a; border-color: var(--accent); }
    button.hot { background: linear-gradient(90deg, #1b3a5a, #3a1b5a); }
    aside { overflow: auto; min-height: 0; }
    #inspector { padding: 10px 12px; flex: 1; overflow: auto; display: block; }
    #lib { display: flex; flex-direction: column; }
    #libTop { position: sticky; top: 0; background: var(--panel); padding: 10px; border-bottom: 1px solid #ffffff0c; z-index: 2; }
    #libTop input { width: 100%; background: #0a0f17; border: 1px solid var(--line); color: var(--text); border-radius: 7px; padding: 6px 9px; outline: none; }
    .tabs { display: flex; gap: 4px; margin-top: 8px; }
    .tabs button { flex: 1; padding: 4px; font-size: 12px; }
    .shelf > summary { list-style: none; cursor: pointer; padding: 7px 10px; font-weight: 600; display: flex; justify-content: space-between; color: #c5d3e4; border-bottom: 1px solid #141c28; }
    .shelf > summary span { color: var(--dim); font-weight: 400; }
    .blk { display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 14px; cursor: grab; user-select: none; }
    .blk:hover { background: #142033; }
    .chip { width: 18px; height: 18px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: #000; font-weight: 700; flex: none; }
    .blk .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .blk .t { font-size: 10px; color: var(--ok); }
    .blk .del { color: var(--dim); padding: 0 4px; cursor: pointer; } .blk .del:hover { color: var(--bad); }
    .shelf .sub { padding: 6px 10px 2px 14px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--dim); }
    main { position: relative; overflow: hidden; min-width: 0; }
    main .pb { position: relative; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: #1a2333ee; border: 1px solid var(--line); padding: 8px 14px; border-radius: 9px; display: none; max-width: 80%; }
    #toast.bad { border-color: var(--bad); }
    #stats { position: absolute; left: 0; right: 0; bottom: 0; padding: 5px 10px; background: #0d121bee; border-top: 1px solid #ffffff0c; color: var(--dim); font-size: 11px; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ititle { font-size: 16px; font-weight: 700; display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
    .ititle input { flex: 1; background: transparent; border: 0; color: var(--text); font: inherit; outline: none; border-bottom: 1px dashed transparent; }
    .ititle input:focus { border-bottom-color: var(--accent); }
    .says { color: var(--dim); margin: 4px 0 10px; }
    h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--dim); margin: 14px 0 6px; }
    .row { display: grid; grid-template-columns: 1fr 1.2fr; gap: 6px; align-items: center; margin: 4px 0; }
    .row label { color: #b8c6d8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
    .row input, .row select, textarea { width: 100%; background: #0a0f17; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 5px 7px; font: inherit; outline: none; }
    textarea { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; min-height: 90px; resize: vertical; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
    .out { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; background: #0a0f17; border-radius: 6px; margin: 3px 0; border-left: 3px solid var(--accent); }
    .out b { font-size: 15px; font-variant-numeric: tabular-nums; }
    .err { color: var(--bad); background: #2a0f12; padding: 6px 8px; border-radius: 6px; margin: 6px 0; }
    .wait { color: var(--wait); background: #2a200a; padding: 6px 8px; border-radius: 6px; margin: 6px 0; }
    .btns { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
    .sug { padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; margin: 5px 0; display: flex; gap: 8px; justify-content: space-between; align-items: center; }
    .src { font-size: 11px; color: var(--dim); }
    .demo { display: block; width: 100%; text-align: left; margin: 4px 0; }
    .kbd { color: var(--dim); font-size: 11px; line-height: 1.7; }
    .kbd b { color: #c5d3e4; font-weight: 600; }
    #narrow { display: none; }
    @media (max-width: 860px) {
      #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 52px minmax(0, 1fr) 42vh; padding: 0 6px 6px; gap: 6px; }
      #right { display: contents; }
      #dock { grid-row: 3; grid-column: 1; }
      #strip { display: none; position: absolute; left: 6px; right: 6px; bottom: 6px; height: 46vh; z-index: 12; grid-template-columns: 1fr; grid-auto-rows: minmax(160px, 1fr); overflow: auto; }
      #strip.open { display: grid; }
      #lib, #inspector { position: absolute; top: 52px; bottom: 0; width: min(88vw, 340px); z-index: 10; display: none; box-shadow: 0 0 40px #000; }
      #lib.open, #inspector.open { display: flex; }
      #lib { left: 0; } #inspector { right: 0; }
      #narrow { display: inline-flex; gap: 6px; }
      header h1 span, #crumbs, #heat, #fit, #undo, #redo, .tag, #spaceLink span, #dock .ph a.btn { display: none; }
      header h1 { font-size: 14px; margin: 0; }
      header { gap: 6px; padding: 0 8px; }
      #cmd { max-width: none; min-width: 0; }
      header button { padding: 6px 8px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#40c4ff"/><stop offset=".5" stop-color="#e040fb"/><stop offset="1" stop-color="#69f0ae"/></linearGradient></defs><path d="M6 10 L16 4 L26 10 L26 22 L16 28 L6 22 Z" fill="none" stroke="url(#lg)" stroke-width="2"/><circle cx="16" cy="4" r="2.6" fill="#40c4ff"/><circle cx="26" cy="22" r="2.6" fill="#69f0ae"/><circle cx="6" cy="22" r="2.6" fill="#e040fb"/><path d="M16 4 L16 16 L26 22 M16 16 L6 22" stroke="#ffffff55" stroke-width="1.4" fill="none"/></svg>
        <h1><b>Nexus</b> <span class="tag">nodes that build anything, from a bolt to a city</span></h1></div>
      <span id="narrow"><button id="libBtn">＋ Blocks</button><button id="insBtn">ⓘ</button><button id="stripBtn">▤</button></span>
      <div id="crumbs"></div>
      <div id="cmd"><input id="cmdIn" placeholder="Add a block or run a command… (Ctrl K)" autocomplete="off" /><div id="cmdList"></div></div>
      <button id="heat" title="Colour blocks by time taken, failures and use">Heat</button>
      <button id="fit" title="Fit the board in view (F)">Fit</button>
      <button id="undo" title="Undo (Ctrl Z)">↶</button>
      <button id="redo" title="Redo (Ctrl Shift Z)">↷</button>
      <a class="btn" id="spaceLink" href="./space.html" title="The space: any scale from µm to km, and in a headset"><span>Enter the</span> space ↗</a>
    </header>
    <aside id="lib" class="pane"><div class="ph"><span class="dotx"></span>Node library<span class="sp"></span></div><div class="pb"><div id="libTop"><input id="libQ" placeholder="Search the library…" /><div class="tabs"><button data-by="domain" class="on">Field</button><button data-by="ability">Ability</button><button data-by="kind">Kind</button></div></div><div id="shelves"></div></div></aside>
    <main class="pane"><div class="ph"><span class="dotx"></span><span id="boardName">Workspace</span><span class="sp"></span><span class="tag" id="boardHint">drag from an output to an input to wire · double-click a group to open it</span></div><div class="pb"><canvas id="cv"></canvas><div id="toast"></div><div id="stats"></div></div></main>
    <div id="strip">
      <section class="pane" id="logP"><div class="ph"><span class="dotx"></span>Run log<span class="sp"></span><span class="tag" id="logSum"></span></div><div class="pb" id="log"></div></section>
      <section class="pane" id="metP"><div class="ph"><span class="dotx"></span>Results &amp; metrics<span class="sp"></span><span class="tag" id="metOf"></span></div><div class="pb"><div id="gauges"></div><div id="metNote"></div></div></section>
      <section class="pane" id="varP"><div class="ph"><span class="dotx"></span>Variations<span class="sp"></span><span id="varCtl"></span></div><div class="pb" id="vars"></div></section>
    </div>
    <div id="right">
      <section class="pane" id="dock"><div class="ph"><span class="dotx"></span>3D view<span class="sp"></span><button id="fit3d" title="See it all">Fit</button><button id="enter3d" title="Fill the page (Esc to come back)">⤢ Enter</button><a class="btn" href="./space.html" title="The immersive space, in a headset too">Space ↗</a></div>
        <div class="pb" id="view3d"><div class="stat3d" id="stat3d"></div></div>
        <div class="tbar" id="tbar"><button id="play" title="Run the clock">▶</button><input id="tslider" type="range" min="0" max="120" step="0.1" value="0" /><span class="tread" id="tread">t = 0.0 s</span><select id="tspan" title="How much of the clock the bar shows"><option value="60">1 min</option><option value="120" selected>2 min</option><option value="600">10 min</option><option value="3600">1 h</option><option value="86400">1 day</option><option value="31557600">1 yr</option></select><select id="trate" title="How fast the clock runs"><option value="1">1×</option><option value="10">10×</option><option value="100">100×</option><option value="1000">1000×</option><option value="86400">1 day/s</option></select></div>
      </section>
      <aside id="inspector" class="pane"></aside>
    </div>
  </div>
  <script type="module" src="../src/nexus/view/dashboard.ts"></script>
</body>
</html>
